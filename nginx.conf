# =============================================================================
# Hedgehog Blog — Nginx 生产配置
# 文件位置：/etc/nginx/conf.d/sanshige.cn.conf（覆盖旧配置）
#
# 架构：sanshige.cn 单一域名，路径式路由
#   /       → 博客前台（HTML5 History）
#   /admin  → 后台管理（Hash 模式，Vite base=/admin/）
#   /api    → Spring Boot 后端（127.0.0.1:8080）
#
# SSL：Let's Encrypt certbot 管理，已存在勿动
# =============================================================================

# ---------- HTTP → HTTPS ----------
server {
    listen 80;
    server_name sanshige.cn www.sanshige.cn;
    return 301 https://$host$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl http2;
    server_name sanshige.cn www.sanshige.cn;

    # SSL（certbot 管理）
    ssl_certificate     /etc/letsencrypt/live/sanshige.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanshige.cn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # 上传文件 — Nginx 直 serve，不穿透 Java
    location /api/admin/upload/ {
        alias /home/app/sanshige.cn/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 代理 → Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # 后台管理（Hash 模式 SPA）
    location /admin {
        alias /home/app/sanshige.cn/admin_blog_web;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 博客前台（HTML5 History 模式 SPA）
    location / {
        root /home/app/sanshige.cn/blog_web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
